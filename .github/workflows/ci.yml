name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release

  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore tools
        run: dotnet tool restore

      - name: Check formatting
        run: dotnet csharpier check .

  generated-code:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SQLITE_COMMIT: 09894b5cd2f3bee2d8385115338cc785ae264046
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch SQLite sources
        run: |
          git init ../sqlite
          git -C ../sqlite remote add origin https://github.com/sqlite/sqlite.git
          git -C ../sqlite fetch --depth 1 origin "$SQLITE_COMMIT"
          git -C ../sqlite checkout --detach FETCH_HEAD

      - name: Regenerate error types
        shell: pwsh
        run: ./tools/Generate-SqliteErrors.ps1 -SqliteRepoPath ../sqlite -SqliteVersionTag ''

      - name: Verify generated files are up to date
        run: git diff --exit-code -- src/LearnSql.Sql/Generated
